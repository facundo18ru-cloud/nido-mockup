<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes — Nido</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="chat.html">

<div id="demo-bar"></div>
<div id="site-header"></div>

<section class="section-tight">
  <div class="wrap">
    <h2 style="font-size:24px;margin-bottom:18px;">Mensajes</h2>

    <div class="chat-shell">
      <div class="chat-list" id="chat-list"><!-- rendered by renderChatList() in js/app.js --></div>

      <div class="chat-main">
        <div class="chat-head">
          <div class="avatar">G</div>
          <div class="who"><strong>Graciela M. — Habitación en Palermo</strong></div>
          <div style="margin-left:auto;">
            <a href="ficha.html" class="btn btn-ghost btn-sm">Ver ficha del inmueble</a>
          </div>
        </div>
        <div class="chat-notice">Sin intercambio de teléfonos · historial persistente dentro de Nido</div>
        <div class="chat-body"><!-- rendered by renderThread() in js/app.js --></div>
        <form id="chat-send" class="chat-input">
          <input type="text" placeholder="Escribí un mensaje...">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </div>

    <div class="flex" style="justify-content:flex-end;margin-top:18px;">
      <a href="contrato.html" class="btn btn-secondary">Generar / revisar contrato →</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/app.js"></script>
</body>
</html>
